name: api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    # Same major version as Neon/local so migrations and DB-backed tests run
    # for real instead of skipping.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: qdjr
          POSTGRES_PASSWORD: qdjr
          POSTGRES_DB: qdjr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qdjr -d qdjr"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgres://qdjr:qdjr@localhost:5432/qdjr?sslmode=disable
      TEST_DATABASE_URL: postgres://qdjr:qdjr@localhost:5432/qdjr?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Migrate (goose, embedded)
        run: go run ./cmd/migrate up

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2 line: v1.x is built with Go 1.24 and refuses a Go 1.27 module.
          version: v2.14.0
          working-directory: apps/api

# Deploys are done by Render from render.yaml (autoDeployTrigger: commit); the
# API applies its embedded goose migrations at startup (RUN_MIGRATIONS=true).

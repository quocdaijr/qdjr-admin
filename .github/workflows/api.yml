name: api

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/api/go.sum

      - name: Test
        run: go test -race ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v2 line: v1.x is built with Go 1.24 and refuses a Go 1.26 module.
          version: v2.14.0
          working-directory: apps/api

# Deploys are done by Render from render.yaml (autoDeployTrigger: commit); the
# API applies its embedded goose migrations at startup (RUN_MIGRATIONS=true).

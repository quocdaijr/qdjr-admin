# wrangler / OpenNext need esbuild's and workerd's native binaries; everything
# else stays blocked from running install scripts.
allowBuilds:
  esbuild: true
  workerd: true
  msw: false
  unrs-resolver: false
  # buf's bin shim resolves the platform binary from its optional deps; the
  # postinstall only pre-checks it. Blocked so CI installs stay script-free.
  "@bufbuild/buf": false
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

# Render Blueprint for the Go API. Connect this repo once in the Render
# dashboard (New → Blueprint); every push to main then redeploys.
# Secrets marked sync: false are entered in the dashboard on first sync.
services:
  - type: web
    name: qdjr-admin-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: apps/api
    # Both paths are relative to rootDir (Render resolved ./apps/api against
    # apps/api and failed with "lstat .../apps/api/apps: no such file").
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: PORT
        value: "8080"
      # Embedded goose migrations run before the server listens; a failing
      # migration fails the health check and Render keeps the previous deploy.
      - key: RUN_MIGRATIONS
        value: "true"
      # Public site + admin (Cloudflare Workers). Add admin.qdjr.dev here if the
      # admin later moves to a custom domain.
      - key: CORS_ORIGINS
        value: https://qdjr.dev,https://www.qdjr.dev,https://qdjr-admin.quocdaijr.workers.dev
      # Neon: pooled URL (host contains "-pooler") for the app, direct URL for
      # goose (schema changes are safest on a direct, non-pooled connection).
      - key: DATABASE_URL
        sync: false
      - key: MIGRATIONS_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # First super_admin; created on first start, ignored once it exists.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      # Cloudflare R2 (S3 API) for media.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: qdjr-media
      # The bucket's public r2.dev URL for now; switch to a custom domain later
      # (URLs are built at read time, so no data migration is needed).
      - key: MEDIA_PUBLIC_BASE_URL
        sync: false
